name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit test suite
      run: npm test

    - name: Verify CLI executable help and flag parsing
      run: ./bin/doublecheck.js --help

    - name: Verify CLI pre-flight doctor check
      run: node ./bin/doublecheck.js --doctor-only || true

    - name: Verify Claude Code Review configuration
      run: test -f .github/REVIEW.md
